services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orm_benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d orm_benchmark"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - benchmark-db:/var/lib/postgresql/data

volumes:
  benchmark-db:
